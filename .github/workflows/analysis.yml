name: Python numerical analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spectral-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            numpy: 'numpy==1.24.4'
          - python: '3.12'
            numpy: 'numpy>=2,<3'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements-analysis.txt
      - run: python -m pip install -r scripts/requirements-analysis.txt '${{ matrix.numpy }}'
      - run: python -m unittest discover -s scripts -p 'test_spectral_time*.py' -v
      - run: python scripts/example_spectral_time_transform.py
