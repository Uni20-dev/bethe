name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'CITATIONS.md', 'zensical.toml', 'scripts/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'README.md', 'CITATIONS.md', 'zensical.toml', 'scripts/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements-site.txt
      - run: pip install -r docs/requirements-site.txt
      - name: Validate tutorial data and Markdown adaptation
        run: |
          python scripts/check_markdown_math.py
          python -m unittest discover -s scripts -p 'test_build_docs.py'
          python -m unittest discover -s scripts -p 'test_tutorial*.py'
      - run: python scripts/build_docs.py
      - run: python scripts/check_docs_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build_codex/docs-site/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
