[project]
site_name = "Bethe ansatz solvers"
site_description = "High-precision reference spectra for MPS and iMPS calculations"
site_url = "https://uni20-dev.github.io/bethe/"
repo_url = "https://github.com/Uni20-dev/bethe"
# scripts/build_docs.py supplies isolated staging/output paths.
docs_dir = "source"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "Overview and model coverage" = "docs/tutorials/index.md" },
    { "XXZ spinons and continua" = "docs/tutorials/xxz-spinons.md" },
    { "Hubbard at half filling" = "docs/tutorials/hubbard-half-filled.md" },
    { "Doping the Hubbard chain" = "docs/tutorials/hubbard-doped.md" },
    { "SU(3)/ULS excitations" = "docs/tutorials/su3-uls.md" },
    { "Takhtajan–Babujian spinons" = "docs/tutorials/takhtajan-babujian.md" },
    { "Lieb–Liniger particle and hole branches" = "docs/tutorials/lieb-liniger.md" },
    { "Sutherland collision branches" = "docs/tutorials/sutherland.md" },
    { "XXX finite chains" = "docs/tutorials/xxx.md" },
    { "Haldane–Shastry motifs and spins" = "docs/tutorials/haldane-shastry.md" },
    { "XYZ bound branches" = "docs/tutorials/xyz.md" },
    { "q-bosons and the phase limit" = "docs/tutorials/q-boson.md" },
    { "Negative biquadratic sectors" = "docs/tutorials/biquadratic.md" },
    { "Ferromagnetic biquadratic defects" = "docs/tutorials/biquadratic-ferromagnetic.md" },
    { "Sine-Gordon particles and finite volume" = "docs/tutorials/sine-gordon.md" },
    { "Scaling Lee–Yang vacuum and gap" = "docs/tutorials/lee-yang.md" },
    { "TASEP relaxation and scaling" = "docs/tutorials/tasep.md" },
    { "ASEP bias and symmetric limit" = "docs/tutorials/asep.md" },
    { "Gaudin–Yang repulsion and roots" = "docs/tutorials/gaudin-yang.md" },
    { "Supersymmetric t–J fillings" = "docs/tutorials/tj.md" },
    { "SU(n) fermion components and seas" = "docs/tutorials/su-fermions.md" },
    { "Bose–Fermi compositions" = "docs/tutorials/bose-fermi.md" },
    { "Potts charged levels and CFT" = "docs/tutorials/potts.md" },
    { "Non-Hermitian XXZ and Jordan blocks" = "docs/tutorials/xxz-nonhermitian.md" },
    { "Richardson pairing and blocking" = "docs/tutorials/richardson.md" },
    { "Central-spin field response" = "docs/tutorials/central-spin.md" },
    { "Kondo impurity response" = "docs/tutorials/kondo.md" },
    { "Integrable ladder magnetization" = "docs/tutorials/ladder.md" },
  ] },
  { "Using Bethe" = [
    { "Building" = "docs/building.md" },
    { "Command line" = "docs/command-line.md" },
    { "Output and exports" = "docs/output.md" },
  ] },
  { "Models" = "docs/models.md" },
  { "References" = "CITATIONS.md" },
  { "Contributing tutorials" = "docs/tutorials/contributing.md" },
]
extra_javascript = [
  "docs/javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

[project.theme]
features = ["navigation.sections", "content.code.copy"]
font = false

[project.markdown_extensions]
tables = {}
fenced_code = {}
toc = { permalink = true }
pymdownx.superfences = {}
